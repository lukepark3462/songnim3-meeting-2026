<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1536" viewBox="0 0 1024 1536"><rect width="1024" height="1536" fill="#f5eee1"/><g font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif"><text x="22" y="36" font-size="23" font-weight="800">송림3지구 조합원 비상대책위원회</text><text x="780" y="36" font-size="21">2026년 10월 9일</text><path d="M18 48H1006" stroke="#222" stroke-width="3"/><text x="26" y="136" font-size="73" font-weight="900">말을 막으면 조용해진다.</text><text x="26" y="229" font-size="78" font-weight="900" fill="#b70918">그러나 진실도 사라지는가.</text><text x="32" y="275" font-size="29" font-weight="800">1942년의 역사에서 2026년 조합원의 미래를 묻다.</text><path d="M20 291H1004" stroke="#222" stroke-width="3"/>
<rect x="20" y="306" width="116" height="34" fill="#183652"/><text x="29" y="331" font-size="21" font-weight="800" fill="white">제1칼럼</text><text x="141" y="330" font-size="14" font-weight="800">역사가 말해주는 교훈</text><text x="20" y="383" font-size="28" font-weight="900">1942년, 우리말을 지키려던</text><text x="20" y="417" font-size="29" font-weight="900">사람들이 끌려갔다</text><rect x="20" y="431" width="307" height="191" fill="#484d50"/>
<circle cx="43" cy="509" r="16" fill="#abb5b8"/><rect x="27" y="530" width="32" height="90" rx="11" fill="#888e91"/>
<circle cx="79" cy="509" r="16" fill="#abb5b8"/><rect x="63" y="530" width="32" height="90" rx="11" fill="#888e91"/>
<circle cx="115" cy="509" r="16" fill="#abb5b8"/><rect x="99" y="530" width="32" height="90" rx="11" fill="#888e91"/>
<circle cx="151" cy="509" r="16" fill="#abb5b8"/><rect x="135" y="530" width="32" height="90" rx="11" fill="#888e91"/>
<circle cx="187" cy="509" r="16" fill="#abb5b8"/><rect x="171" y="530" width="32" height="90" rx="11" fill="#888e91"/>
<circle cx="223" cy="509" r="16" fill="#abb5b8"/><rect x="207" y="530" width="32" height="90" rx="11" fill="#888e91"/>
<circle cx="259" cy="509" r="16" fill="#abb5b8"/><rect x="243" y="530" width="32" height="90" rx="11" fill="#888e91"/>
<circle cx="295" cy="509" r="16" fill="#abb5b8"/><rect x="279" y="530" width="32" height="90" rx="11" fill="#888e91"/>
<text x="20" y="662" font-size="20" font-weight="500" fill="#252525">1942년 일제강점기, 우리말을 연구하고</text>
<text x="20" y="698" font-size="20" font-weight="500" fill="#252525">사전을 편찬하던 조선어학회 회원들이</text>
<text x="20" y="734" font-size="20" font-weight="500" fill="#252525">일제 경찰에 검거되었습니다.</text>
<text x="20" y="770" font-size="20" font-weight="500" fill="#252525">우리말을 지키려던 활동은 탄압의 대상이</text>
<text x="20" y="806" font-size="20" font-weight="500" fill="#252525">되었고 사전 편찬사업은 중단되었습니다.</text>
<text x="20" y="842" font-size="20" font-weight="850" fill="#b11321">사람들이 자신의 말과 행동을 두려워하기</text>
<text x="20" y="878" font-size="20" font-weight="850" fill="#b11321">시작하면 사회는 조용해질 수 있습니다.</text>
<path d="M341 303V950" stroke="#ad9e8a"/>
<rect x="357" y="306" width="116" height="34" fill="#183652"/><text x="366" y="331" font-size="21" font-weight="800" fill="white">제2칼럼</text><text x="478" y="330" font-size="14" font-weight="800">한 조합원과의 통화, 사실 왜곡</text><text x="357" y="383" font-size="28" font-weight="900">한 조합원의 통화,</text><text x="357" y="417" font-size="29" font-weight="900">사실인가 해석인가?</text><rect x="357" y="431" width="307" height="191" fill="#1b252e"/>
<circle cx="459" cy="521" r="53" fill="#090d13"/><rect x="408" y="572" width="106" height="49" rx="24" fill="#090e14"/><text x="526" y="528" font-size="25" font-weight="900" fill="#ffaaaa">사실인가?</text><text x="526" y="566" font-size="25" font-weight="900" fill="#ffaaaa">해석인가?</text>
<text x="357" y="662" font-size="20" font-weight="500" fill="#252525">최근 조합장과 강모 조합원의 통화내용을</text>
<text x="357" y="698" font-size="20" font-weight="500" fill="#252525">둘러싸고 논란이 발생했습니다.</text>
<text x="357" y="734" font-size="20" font-weight="500" fill="#252525">비대위는 통화내용을 검토한 결과,</text>
<text x="357" y="770" font-size="20" font-weight="500" fill="#252525">조합원의 발언이 실제 취지와 다르게</text>
<text x="357" y="806" font-size="20" font-weight="500" fill="#252525">전달될 수 있다는 문제를 제기했습니다.</text>
<text x="357" y="842" font-size="20" font-weight="850" fill="#b11321">조합원에게 정확한 사실관계를 요구한다면</text>
<text x="357" y="878" font-size="20" font-weight="850" fill="#b11321">조합 역시 같은 기준을 적용해야 합니다.</text>
<path d="M678 303V950" stroke="#ad9e8a"/>
<rect x="694" y="306" width="116" height="34" fill="#183652"/><text x="703" y="331" font-size="21" font-weight="800" fill="white">제3칼럼</text><text x="815" y="330" font-size="14" font-weight="800">오늘의 논란, 내일의 조합</text><text x="694" y="383" font-size="28" font-weight="900">오늘은 한 사람,</text><text x="694" y="417" font-size="29" font-weight="900">내일은 누구의 차례인가</text><rect x="694" y="431" width="307" height="191" fill="#33383a"/>
<circle cx="720" cy="533" r="19" fill="#666b6d"/><rect x="697" y="552" width="46" height="70" rx="14" fill="#666b6d"/>
<circle cx="769" cy="533" r="19" fill="#666b6d"/><rect x="746" y="552" width="46" height="70" rx="14" fill="#666b6d"/>
<circle cx="818" cy="533" r="19" fill="#666b6d"/><rect x="795" y="552" width="46" height="70" rx="14" fill="#666b6d"/>
<circle cx="867" cy="533" r="19" fill="#c6273b"/><rect x="844" y="552" width="46" height="70" rx="14" fill="#c6273b"/>
<circle cx="916" cy="533" r="19" fill="#666b6d"/><rect x="893" y="552" width="46" height="70" rx="14" fill="#666b6d"/>
<circle cx="965" cy="533" r="19" fill="#666b6d"/><rect x="942" y="552" width="46" height="70" rx="14" fill="#666b6d"/>
<text x="862" y="504" font-size="78" font-weight="900" fill="#f65260">?</text>
<text x="694" y="662" font-size="20" font-weight="500" fill="#252525">이번 논란은 조합원 한 사람의 문제만은</text>
<text x="694" y="698" font-size="20" font-weight="500" fill="#252525">아닐 수 있습니다.</text>
<text x="694" y="734" font-size="20" font-weight="500" fill="#252525">비판적인 의견이 논쟁의 대상이 된다면,</text>
<text x="694" y="770" font-size="20" font-weight="500" fill="#252525">다른 조합원들은 어떻게 생각할까요?</text>
<text x="694" y="806" font-size="20" font-weight="500" fill="#252525">“나도 한마디 했다가 고소당하는 것은</text>
<text x="694" y="842" font-size="20" font-weight="850" fill="#b11321">아닐까.”</text>
<text x="694" y="878" font-size="20" font-weight="850" fill="#b11321">우리는 자유롭게 질문할 수 있어야 합니다.</text>
<rect y="981" width="1024" height="243" fill="#0b1827"/><text x="512" y="1051" font-size="38" text-anchor="middle" fill="white" font-weight="900">오늘은 우리 이웃 조합원 한 사람이었습니다.</text><text x="512" y="1128" font-size="58" text-anchor="middle" fill="#f23640" font-weight="900">내일은 누구의 차례가 되겠습니까?</text><text x="512" y="1173" font-size="23" text-anchor="middle" fill="white">앞으로 누가 조합에 자신의 의견을 말할 수 있겠습니까?</text><rect y="1224" width="1024" height="43" fill="#b81926"/><text x="512" y="1254" text-anchor="middle" font-size="24" fill="white" font-weight="800">우리는 자유롭게 질문하고 의견을 말할 수 있어야 합니다.</text><rect x="20" y="1281" width="60" height="137" fill="#163a5c"/><text x="50" y="1336" font-size="26" font-weight="900" text-anchor="middle" fill="white">결</text><text x="50" y="1375" font-size="26" font-weight="900" text-anchor="middle" fill="white">론</text><text x="104" y="1322" font-size="33" font-weight="900" fill="#103150">역사가 우리에게 가르쳐준 것은</text><text x="104" y="1364" font-size="31" font-weight="900" fill="#103150">침묵이 아니라 말할 수 있는 권리입니다.</text><text x="104" y="1402" font-size="20" font-weight="800" fill="#b41628">우리는 어떤 조합을 미래에 남겨줄 것입니까.</text><rect x="0" y="1432" width="1024" height="104" fill="#123454"/><text x="512" y="1471" text-anchor="middle" font-size="30" font-weight="900" fill="white">2026년 10월 16일(금) 오후 7시 30분</text><text x="512" y="1510" text-anchor="middle" font-size="30" font-weight="900" fill="#ffdb56">송림3지구 조합임원 해임 임시총회</text></g></svg>